name: CDK Terrain
description: Run CDK Terrain (CDKTN) — synth, plan, apply or destroy — with OpenTofu (default) or Terraform.
author: CDK Terrain

branding:
  icon: terminal
  color: purple

inputs:
  cdktnVersion:
    description: Version of cdktn-cli to run (fetched on demand via npx). Required unless cdktfVersion or useLocalCli is set.
    required: false
  cdktfVersion:
    description: "Deprecated: version of the legacy cdktf-cli to run instead of cdktn-cli. Prefer cdktnVersion."
    required: false
  useLocalCli:
    description: >-
      Run the CLI installed in the project's node_modules (`npx --no cdktn`)
      instead of fetching a version via npx, so the version comes from the
      project's lockfile. Install dependencies before this step.
    required: false
    default: "false"
  engine:
    description: >-
      Provisioning engine to drive: `auto` (default — detect from PATH, preferring
      OpenTofu), `tofu` (OpenTofu) or `terraform`. Sets TERRAFORM_BINARY_NAME.
    required: false
    default: auto
  engineVersion:
    description: >-
      Exact engine version that must already be on PATH. The action verifies but
      does not install it; use opentofu/setup-opentofu or hashicorp/setup-terraform
      first. Leave empty to only check the binary is present.
    required: false
    default: ""
  terraformVersion:
    description: "Deprecated alias for engineVersion."
    required: false
    default: ""
  workingDirectory:
    description: Directory the CDK Terrain project lives in.
    required: false
    default: ./
  mode:
    description: >-
      What to run: `synth-only` (synthesize), `plan-only` (plan a stack),
      `auto-approve-apply` (plan then apply --auto-approve), or
      `auto-approve-destroy` (plan then destroy --auto-approve).
    required: true
  stackName:
    description: Stack to operate on. Required for every mode except `synth-only`.
    required: false
  cloudToken:
    description: HCP Terraform / Terraform Enterprise API token (exported as TF_TOKEN_app_terraform_io).
    required: false
  terraformCloudToken:
    description: "Deprecated alias for cloudToken."
    required: false
  githubToken:
    description: Token used to post the run result as a pull request comment. No comment is posted if omitted.
    required: false
  commentOnPr:
    description: Whether to post the run result as a comment on the associated pull request.
    required: false
    default: "true"
  updateComment:
    description: Update the previous comment for this configuration instead of adding a new one.
    required: false
    default: "true"
  customNpxArgs:
    description: Extra CLI arguments passed to `npx` before the CLI package.
    required: false
    default: ""
  cdktnArgs:
    description: Extra CLI arguments passed to the `cdktn` command.
    required: false
    default: ""
  cdktfArgs:
    description: "Deprecated alias for cdktnArgs."
    required: false
    default: ""
  suppressOutput:
    description: Omit the captured CLI output from the pull request comment.
    required: false
    default: "false"

outputs:
  exitCode:
    description: Exit code returned by the CLI invocation.
  output:
    description: Combined stdout/stderr captured from the CLI invocation.
  stackOutputs:
    description: >-
      Stack output values as a JSON string keyed by stack name, from
      `cdktn apply --outputs-file`. Set only after a successful
      `auto-approve-apply`. Sensitive outputs are excluded.

runs:
  using: node24
  main: dist/index.js
