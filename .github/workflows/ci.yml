name: CI

on:
  push:
    branches: [main]
  pull_request:

# No permissions by default; jobs opt in to exactly what they need.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, type-check, test & bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain (node, actionlint, zizmor)
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1

      - name: Install dependencies
        run: npm ci

      - name: Lint & format check (Biome)
        run: npm run check

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Bundle dist/
        run: npm run package
