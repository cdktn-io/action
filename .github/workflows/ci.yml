name: CI

on:
  push:
    branches: [main]
  pull_request:

# No permissions by default; jobs opt in to exactly what they need.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, type-check, test & bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain (node, actionlint, zizmor)
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1

      - name: Install dependencies
        run: npm ci

      - name: Lint & format check (Biome)
        run: npm run check

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Bundle dist/
        run: npm run package

  # Runs the committed dist/ end to end against a real project. The fixture is
  # the unmodified output of `cdktn init --template typescript-pnpm`.
  smoke:
    name: Smoke test (synth-only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain (node)
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_wrapper: false

      - name: Install fixture dependencies
        working-directory: __fixtures__/smoke
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Run the action
        id: synth
        uses: ./ # zizmor: ignore[self-repository]
        with:
          mode: synth-only
          # Keep in step with the cdktn version in __fixtures__/smoke/package.json.
          cdktnVersion: 0.25.0-pre.54
          workingDirectory: __fixtures__/smoke
          commentOnPr: 'false'

      - name: Verify the synthesized stack
        env:
          EXIT_CODE: ${{ steps.synth.outputs.exitCode }}
        run: |
          test "$EXIT_CODE" = "0"
          test -s __fixtures__/smoke/cdktf.out/stacks/smoke/cdk.tf.json
